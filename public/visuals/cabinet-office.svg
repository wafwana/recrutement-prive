<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCabinet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081625"/>
      <stop offset="100%" stop-color="#0b1b2b"/>
    </linearGradient>
    <linearGradient id="goldCabinet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c7a15a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Room Background -->
  <rect width="1200" height="800" fill="url(#bgCabinet)"/>

  <!-- High-Rise Panoramic Windows -->
  <polygon points="100,50 1100,50 1000,600 200,600" fill="url(#glass)" stroke="#c7a15a" stroke-width="2" opacity="0.4"/>
  <line x1="400" y1="50" x2="450" y2="600" stroke="#c7a15a" stroke-width="1.5" opacity="0.3"/>
  <line x1="800" y1="50" x2="750" y2="600" stroke="#c7a15a" stroke-width="1.5" opacity="0.3"/>

  <!-- Skyline Lights / Cityscape -->
  <g opacity="0.25">
    <rect x="220" y="300" width="60" height="250" fill="#f8fafc"/>
    <rect x="300" y="220" width="80" height="330" fill="#f8fafc"/>
    <rect x="500" y="180" width="100" height="370" fill="#f8fafc"/>
    <rect x="620" y="260" width="70" height="290" fill="#f8fafc"/>
    <rect x="820" y="200" width="90" height="350" fill="#f8fafc"/>
  </g>

  <!-- Executive Desk -->
  <polygon points="150,620 1050,620 1150,780 50,780" fill="#1e293b" stroke="url(#goldCabinet)" stroke-width="3"/>
  <polygon points="200,625 1000,625 1020,650 180,650" fill="#0f172a"/>

  <!-- Laptop & Executive Accessories on Desk -->
  <polygon points="520,640 680,640 700,720 500,720" fill="#334155" stroke="#f8fafc" stroke-width="1"/>
  <polygon points="530,645 670,645 660,570 540,570" fill="#020617" stroke="url(#goldCabinet)" stroke-width="2"/>

  <!-- Gold Branding Inscription -->
  <text x="600" y="750" text-anchor="middle" fill="#c7a15a" font-family="serif" font-size="22" letter-spacing="4">RECRUTEMENT PRIVÉ · PARIS &amp; INTERNATIONAL</text>
</svg>
