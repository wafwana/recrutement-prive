name: Verify & Recover Prisma Production Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "CONFIRM_MIGRATE_PRODUCTION" only for an explicitly authorized production recovery'
        required: true
        default: ''
      resolve_0010:
        description: 'Type "CONFIRM_RESOLVE_0010_APPLIED" only after the read-only validator has passed'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: production-prisma-recovery
  cancel-in-progress: false

jobs:
  precheck:
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm_production == 'CONFIRM_MIGRATE_PRODUCTION' && github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
    name: Read-only 0010 schema precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Require production secret without exposing it
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          test -n "$DATABASE_URL_PRODUCTION" || { echo "DATABASE_URL_PRODUCTION is missing"; exit 1; }
      - name: Normalize production URL for Prisma CLI (direct Neon connection)
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = process.env.DATABASE_URL_PRODUCTION;
          const url = new URL(raw);
          if (url.protocol !== 'postgresql:' && url.protocol !== 'postgres:') {
            throw new Error('DATABASE_URL_PRODUCTION must be a PostgreSQL URL');
          }
          url.hostname = url.hostname.replace(/-pooler(?=\.)/, '');
          if (!url.searchParams.has('sslmode')) url.searchParams.set('sslmode', 'require');
          fs.appendFileSync(process.env.GITHUB_ENV, 'DATABASE_URL=' + url.toString() + '\n');
          NODE
      - name: Validate migration 0010 schema (read-only)
        run: npx tsx scripts/check-migration-0010.ts

  recovery:
    name: Controlled Prisma recovery
    needs: precheck
    if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.confirm_production == 'CONFIRM_MIGRATE_PRODUCTION' && github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Normalize production URL for Prisma CLI (direct Neon connection)
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const raw = process.env.DATABASE_URL_PRODUCTION;
          const url = new URL(raw);
          if (url.protocol !== 'postgresql:' && url.protocol !== 'postgres:') {
            throw new Error('DATABASE_URL_PRODUCTION must be a PostgreSQL URL');
          }
          url.hostname = url.hostname.replace(/-pooler(?=\.)/, '');
          if (!url.searchParams.has('sslmode')) url.searchParams.set('sslmode', 'require');
          fs.appendFileSync(process.env.GITHUB_ENV, 'DATABASE_URL=' + url.toString() + '\n');
          NODE
      - name: Require explicit resolve authorization
        if: ${{ github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
        run: echo "Explicit 0010 resolve authorization accepted."
      - name: Resolve only 0010 after independent precheck (idempotent)
        if: ${{ github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
        run: npx tsx scripts/recover-migration-0010.ts
      - name: Deploy remaining migrations
        run: npx prisma migrate deploy
      - name: Final migration status
        run: npx prisma migrate status
      - name: Schema validator after deploy (read-only)
        run: npx tsx scripts/check-migration-0010.ts
