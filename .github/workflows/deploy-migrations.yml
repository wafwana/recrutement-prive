name: Deploy Production Database Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "CONFIRM_MIGRATE_PRODUCTION" to execute migrations on Neon Production'
        required: true
        default: ''
      resolve_migration_mode:
        description: 'P3009 resolution mode for 0010_mission_presentation_lock: "none", "applied", or "rolled_back"'
        required: false
        default: 'none'

jobs:
  migrate-production:
    name: Execute Prisma Migrations on Neon Production
    runs-on: ubuntu-latest

    steps:
      - name: Verify Production Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "CONFIRM_MIGRATE_PRODUCTION" ]; then
            echo "Error: You must type 'CONFIRM_MIGRATE_PRODUCTION' to trigger this workflow."
            exit 1
          fi
          echo "Production migration confirmation verified."

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify DATABASE_URL_PRODUCTION Secret Presence
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          if [ -z "$DATABASE_URL_PRODUCTION" ]; then
            echo "Error: DATABASE_URL_PRODUCTION secret is missing or empty in GitHub Repository Secrets."
            echo "Please set DATABASE_URL_PRODUCTION in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "DATABASE_URL_PRODUCTION secret is present and verified."

      - name: Run Schema & Migration Pre-Check Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          RESOLVE_MODE: ${{ github.event.inputs.resolve_migration_mode }}
        run: |
          echo "Running pre-check inspection on Neon Production..."
          npx tsx scripts/check-migration-0010.ts

      - name: Resolve P3009 Migration Lock (If Safe & Requested)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          RESOLVE_MODE: ${{ github.event.inputs.resolve_migration_mode }}
        run: |
          if [ "$RESOLVE_MODE" = "applied" ]; then
            echo "Resolving 0010_mission_presentation_lock as APPLIED..."
            npx prisma migrate resolve --applied "0010_mission_presentation_lock"
          elif [ "$RESOLVE_MODE" = "rolled_back" ]; then
            echo "Resolving 0010_mission_presentation_lock as ROLLED BACK..."
            npx prisma migrate resolve --rolled-back "0010_mission_presentation_lock"
          else
            echo "No migration lock resolution requested (mode: $RESOLVE_MODE)."
          fi

      - name: Run Prisma Migrate Deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Running 'npx prisma migrate deploy' on Neon Production..."
          npx prisma migrate deploy

      - name: Verify Prisma Migration Status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          echo "Checking migration status on Neon Production..."
          npx prisma migrate status

      - name: Post-Migration OWNER Columns Verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
          RESOLVE_MODE: "none"
        run: |
          echo "Checking that all OWNER columns (Company.siren, Job.attachmentName, CandidateDocument.folderPath) exist..."
          npx tsx scripts/check-migration-0010.ts
