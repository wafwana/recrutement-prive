<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081625"/>
      <stop offset="50%" stop-color="#0b1b2b"/>
      <stop offset="100%" stop-color="#050e18"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c7a15a"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0a9"/>
      <stop offset="100%" stop-color="#e0a978"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Decorative Gold Ring & Grid Overlay -->
  <circle cx="400" cy="450" r="320" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.3" stroke-dasharray="8 6"/>
  <circle cx="400" cy="450" r="380" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.15"/>
  <path d="M 0 500 H 800 M 400 0 V 1000" stroke="#c7a15a" stroke-width="1" opacity="0.1"/>

  <!-- Executive Silhouette Portrait -->
  <g transform="translate(0, 50)">
    <!-- Shoulders / Suit -->
    <path d="M 180 900 Q 400 600 620 900 L 680 1000 H 120 Z" fill="url(#suit)"/>
    <!-- Shirt Collar -->
    <polygon points="340,680 400,800 460,680 430,660 400,700 370,660" fill="#ffffff"/>
    <!-- Tie -->
    <polygon points="390,700 410,700 415,880 400,900 385,880" fill="url(#goldGrad)"/>
    <!-- Neck -->
    <rect x="360" y="580" width="80" height="120" rx="10" fill="url(#skin)"/>
    <!-- Head Base -->
    <ellipse cx="400" cy="450" rx="130" ry="170" fill="url(#skin)"/>
    <!-- Hair -->
    <path d="M 270 420 Q 300 260 400 260 Q 500 260 530 420 Q 470 300 400 300 Q 330 300 270 420 Z" fill="#1e1e1e"/>
    <!-- Glasses -->
    <rect x="310" y="420" width="70" height="40" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <rect x="420" y="420" width="70" height="40" rx="8" fill="none" stroke="url(#goldGrad)" stroke-width="4"/>
    <line x1="380" y1="440" x2="420" y2="440" stroke="url(#goldGrad)" stroke-width="4"/>
    <!-- Confidence Smile & Beard -->
    <path d="M 360 530 Q 400 560 440 530" stroke="#9e663e" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Badge Overlay -->
  <rect x="50" y="820" width="300" height="120" rx="12" fill="#081625" stroke="url(#goldGrad)" stroke-width="2" opacity="0.95"/>
  <text x="80" y="865" fill="#f8fafc" font-family="serif" font-size="20" font-weight="bold">RECRUTEMENT PRIVÉ</text>
  <text x="80" y="895" fill="#c7a15a" font-family="sans-serif" font-size="14" letter-spacing="2">EXECUTIVE SEARCH &amp; CHASSE</text>
</svg>
