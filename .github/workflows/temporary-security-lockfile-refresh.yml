name: Temporary security lockfile refresh

on:
  push:
    branches:
      - fix/security-audit-17-vulns-2026-10-06
    paths:
      - package.json
      - .github/workflows/temporary-security-lockfile-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm audit --json > audit.json || true
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json audit.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(security): refresh lockfile"
          git push origin HEAD:fix/security-audit-17-vulns-2026-10-06
