name: Read-only Prisma 0010 Precheck

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prisma-0010-readonly-precheck
  cancel-in-progress: false

jobs:
  precheck:
    name: Read-only schema and ledger validation
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Validate migration 0010 (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: npx tsx scripts/check-migration-0010.ts
