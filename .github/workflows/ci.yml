name: CI

on:
  push:
    branches: [main, lot-1-fondations, lot-2-espace-metiers, lot-3-auth-backend, lot-3-finalisation, lot-4-candidat]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recrutement_prive
      AUTH_SECRET: ci-test-secret-for-recrutement-prive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''
      - run: npm install
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
