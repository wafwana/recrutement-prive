name: Verify & Recover Prisma Production Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 'Type "CONFIRM_MIGRATE_PRODUCTION" only for an explicitly authorized production recovery'
        required: true
        default: ''
      resolve_0010:
        description: 'Type "CONFIRM_RESOLVE_0010_APPLIED" only after the read-only validator has passed'
        required: true
        default: 'NO'

concurrency:
  group: production-prisma-recovery
  cancel-in-progress: false

jobs:
  precheck:
    if: ${{ github.event.inputs.confirm_production == 'CONFIRM_MIGRATE_PRODUCTION' && github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
    name: Read-only 0010 schema precheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Require production secret without exposing it
        env:
          DATABASE_URL_PRODUCTION: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: |
          test -n "$DATABASE_URL_PRODUCTION" || { echo "DATABASE_URL_PRODUCTION is missing"; exit 1; }
      - name: Validate migration 0010 schema (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: npx tsx scripts/check-migration-0010.ts

  recovery:
    name: Controlled Prisma recovery
    needs: precheck
    if: ${{ github.event.inputs.confirm_production == 'CONFIRM_MIGRATE_PRODUCTION' && github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Require explicit resolve authorization
        if: ${{ github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
        run: echo "Explicit 0010 resolve authorization accepted."
      - name: Resolve 0010 only after independent precheck
        if: ${{ github.event.inputs.resolve_0010 == 'CONFIRM_RESOLVE_0010_APPLIED' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: npx prisma migrate resolve --applied 0010_mission_presentation_lock
      - name: Deploy remaining migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: npx prisma migrate deploy
      - name: Final migration status
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: npx prisma migrate status
      - name: Schema validator after deploy (read-only)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCTION }}
        run: npx tsx scripts/check-migration-0010.ts
