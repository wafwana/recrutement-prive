name: CI

on:
  push:
    branches:
      - main
      - lot-1-fondations
      - lot-2-espace-metiers
      - lot-3-auth-backend
      - lot-3-finalisation
      - lot-4-candidat
      - lot-5-entreprise
      - lot-5-multi-company-hardening
      - lot-6-consultant
      - lot-7-consolidation
      - lot-7-8-finalisation
      - agent/final-platform
      - agent/final-validation
      - agent/e2e-finalization
      - agent/e2e-finalization-v2
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recrutement_prive
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d recrutement_prive"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recrutement_prive
      AUTH_SECRET: ci-test-secret-for-recrutement-prive
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ''
      - run: npm ci
      - name: Audit npm dependency vulnerabilities
        run: npm audit
      - name: OWNER compatibility gate — FIRST verification
        run: npm run test:owner-compatibility
      - name: Validate Lot 1 factual-assistance guardrails
        run: node --import tsx --test tests/lot-1-no-invention-guardrails.test.ts
      - name: Validate Pôle 1 CV intake, offer detail and bounded matching regressions
        run: node --import tsx --test tests/pole-1-regressions.test.ts
      - name: Verify Gemini structured-output schema contract
        run: npm run test:gemini-schema-normalization
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Validate migration history 0011-0014 after local deploy
        run: npx tsx scripts/check-migrations-0011-0014.ts
      - name: Validate migration 0010 schema after local deploy
        run: npx tsx scripts/check-migration-0010.ts
      - run: npm run test:migration-check
      - run: npm run test:trusted-video
      - run: npm run test:mission-lock
      - run: npm run test:candidate-auth
      - run: npm run test:candidate-flow
      - run: npm run test:company-flow
      - run: npm run test:company-registration
      - name: Validate enterprise job taxonomy server actions
        run: node --import tsx --test tests/enterprise-job-taxonomy-actions.test.ts
      - name: Validate OWNER-only candidate presentation governance
        run: node --import tsx --test tests/owner-candidate-presentation-governance.test.ts
      - run: npm run test:taxonomy-cv-protection
      - run: npm run test:sanitize-postgres-json
      - run: npm run test:cv-intelligence
      - run: npm run test:cv-folder-classification
      - run: npm run test:cv-rematch-batch-window
      - run: npm run test:cron-schedule
      - run: npm run test:global-jobs-cron-batch
      - run: npm run test:global-sourcing
      - run: npm run test:candidate-sourcing-config
      - run: npm run test:sourcing-candidate-status
      - run: npm run test:proactive-search
      - run: npm run test:enterprise-sourcing-batch
      - run: npm run test:enterprise-candidate-matches
      - run: npm run test:ai-provider
      - run: npm run test:internal-messaging
      - run: npm run test:secure-contact
      - run: npm run test:secure-contact-authorization
      - run: npm run test:cv-matching-dashboard
      - run: npm run test:secure-contact-payments
      - name: Validate public contact form input and abuse guard
        run: node --import tsx --test tests/public-contact-validation.test.ts
      - name: Validate CV consent authorization and revocation gate
        run: node --import tsx --test tests/cv-intake-consent-gate.test.ts
      - name: Validate secure external offer to internal draft integration
        run: node --import tsx --test tests/external-offer-integration.test.ts
      - name: Validate OWNER manual sourcing, candidate history, accessibility and audit contract
        run: node --import tsx --test tests/owner-sourcing-manual-ui.test.ts
      - run: npm run test:executive-search
      - run: npx tsx tests/candidate-integration.ts
      - run: npx tsx tests/final-validation.ts
      - run: npx tsx tests/offer-attachment-validation.ts
      - run: npm run test:admin-partners-security
      - run: npm run test:partner-sourcing-usability
      - run: npm run test:security
      - run: npm run test:global-back-navigation
      - run: npm run test:sector-visuals
      - run: npm run test:owner-permissions-governance
      - run: npm run test:api-authorization-matrix
      - run: npm run test:owner-candidates-directory
      - run: npm run test:owner-workspace-navigation
      - run: npm run test:role-workspace-navigation
      - run: npm run test:workspace-navigation-locales
      - name: Validate Help Center and mailing templates
        run: node --import tsx --test tests/help-center-mailings-search.test.ts
      - run: npm run typecheck
      - run: npm run build
      - name: End-to-end Auth.js login, CV intake and OWNER outflows over HTTP
        run: npm run test:owner-cv-intake
