<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEnterprise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2b"/>
      <stop offset="100%" stop-color="#081625"/>
    </linearGradient>
    <linearGradient id="goldHand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c7a15a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgEnterprise)"/>

  <!-- Geometric Connection Network -->
  <g stroke="#c7a15a" stroke-width="1.5" opacity="0.2" fill="none">
    <polygon points="100,100 300,400 200,700"/>
    <polygon points="1100,100 900,400 1000,700"/>
    <line x1="300" y1="400" x2="900" y2="400"/>
    <circle cx="300" cy="400" r="10" fill="#f97316"/>
    <circle cx="900" cy="400" r="10" fill="#c7a15a"/>
    <circle cx="600" cy="400" r="15" fill="url(#goldHand)"/>
  </g>

  <!-- Corporate Handshake Symbol -->
  <g transform="translate(300, 200)">
    <!-- Left Arm / Cuff -->
    <path d="M 0 250 L 180 200 L 220 230 L 100 320 Z" fill="#1e293b" stroke="url(#goldHand)" stroke-width="3"/>
    <polygon points="180,200 210,190 225,220 195,230" fill="#ffffff"/>

    <!-- Right Arm / Cuff -->
    <path d="M 600 250 L 420 200 L 380 230 L 500 320 Z" fill="#0f172a" stroke="url(#goldHand)" stroke-width="3"/>
    <polygon points="420,200 390,190 375,220 405,230" fill="#ffffff"/>

    <!-- Clasped Hands -->
    <path d="M 210 190 Q 300 150 330 220 Q 360 210 390 190 Q 360 280 280 270 Q 220 260 210 190 Z" fill="url(#goldHand)"/>
  </g>

  <!-- Title Badge -->
  <text x="600" y="650" text-anchor="middle" fill="#f8fafc" font-family="serif" font-size="28" font-weight="bold">PARTENARIAT RECRUTEUR &amp; ENTREPRISE</text>
  <text x="600" y="690" text-anchor="middle" fill="#c7a15a" font-family="sans-serif" font-size="16" letter-spacing="3">ACCOMPAGNEMENT STRATÉGIQUE &amp; SÉCURISÉ</text>
</svg>
